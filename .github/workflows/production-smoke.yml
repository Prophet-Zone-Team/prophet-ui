name: Production Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

jobs:
  trading-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Trading production smoke
        env:
          TRADING_SMOKE_BASE_URL: https://wc.dolla.market
          TRADING_SMOKE_SKIP_D1: "1"
        run: npm run smoke:trading:prod
